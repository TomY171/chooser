<!doctype html>
<html lang="he">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chooser">
<meta name="application-name" content="Chooser">
<meta name="theme-color" content="#0f0f0f">
<meta name="color-scheme" content="dark">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Chooser</title>
<style>
  :root { color-scheme: dark; }
  [hidden] { display: none !important; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0f0f0f;
    overflow: hidden;
    overscroll-behavior: none;
  }
  body {
    position: fixed; inset: 0;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
    touch-action: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
  #stage {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    display: block;
    touch-action: none;
  }

  /* Hidden settings sheet (opened with the secret corner taps). */
  #settings {
    position: fixed; left: 0; right: 0; z-index: 10;
    padding: 10px max(10px, env(safe-area-inset-right)) 10px max(10px, env(safe-area-inset-left));
    pointer-events: none;
  }
  #settings.top { top: env(safe-area-inset-top); }
  #settings.bottom { bottom: env(safe-area-inset-bottom); }
  .sheet {
    pointer-events: auto;
    max-width: 460px; margin: 0 auto;
    max-height: 58vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
    background: rgba(28, 28, 30, 0.94);
    color: #fff; border-radius: 16px;
    padding: 6px 14px 12px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
    font-size: 15px; line-height: 1.25;
    touch-action: pan-y;
    -webkit-user-select: none; user-select: none;
  }
  .head { display: flex; align-items: center; justify-content: space-between; padding: 6px 0 4px; }
  .head b { font-size: 17px; }
  .row {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 9px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }
  .row:last-child { border-bottom: 0; }
  .row span small, .note small { display: block; color: #8e8e93; font-size: 12px; margin-top: 2px; }
  .note { margin: 6px 0 2px; color: #c7c7cc; font-size: 13px; }
  button {
    font: inherit; color: #fff; background: #3a3a3c;
    border: 0; border-radius: 10px; padding: 8px 12px; cursor: pointer;
    touch-action: manipulation;
  }
  button.primary { background: #0a84ff; }
  button.wide { width: 100%; }
  .seg { display: inline-flex; background: #2c2c2e; border-radius: 10px; padding: 2px; gap: 2px; }
  .seg button { background: transparent; padding: 7px 12px; }
  .seg button.on { background: #636366; }
  .btns { justify-content: flex-start; }
  .btns button { flex: 1; }
  input[type="range"] { flex: 1; max-width: 170px; accent-color: #0a84ff; touch-action: pan-x; }
  output { min-width: 2.5em; text-align: center; color: #c7c7cc; font-variant-numeric: tabular-nums; }
  /* iOS-style switch */
  .sw { -webkit-appearance: none; appearance: none; flex: none; position: relative; width: 51px; height: 31px; margin: 0;
        border-radius: 31px; background: #39393d; transition: background .2s; cursor: pointer; }
  .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%;
        background: #fff; box-shadow: 0 2px 4px rgba(0,0,0,.3); transition: transform .2s; }
  .sw:checked { background: #30d158; }
  .sw:checked::after { transform: translateX(20px); }
</style>
</head>
<body>
<canvas id="stage"></canvas>

<div id="settings" class="top" hidden>
  <div class="sheet" dir="rtl" lang="he">
    <div class="head">
      <b>הגדרות סודיות</b>
      <button id="s-dock" type="button" aria-label="Move panel">⇅</button>
    </div>
    <label class="row"><span>צ'יט פעיל<small>Cheat on</small></span><input class="sw" type="checkbox" id="s-cheat"></label>
    <label class="row"><span>נקודת "לא נבחר" = מראה של נקודת הזכייה<small>Lose spot mirrors the win spot</small></span><input class="sw" type="checkbox" id="s-mirror"></label>
    <div class="row"><span>איזו נקודה להזיז<small>Spot to move</small></span>
      <div class="seg"><button id="s-sel-win" type="button" class="on">✓ זכייה</button><button id="s-sel-lose" type="button">✗ לא נבחר</button></div>
    </div>
    <p class="note">גע או גרור על המסך כדי למקם את הנקודה (ירוק = תמיד נבחר, אדום = אף פעם)<small>Touch or drag on the screen to place it (green = always picked, red = never)</small></p>
    <label class="row"><span>גודל נקודה<small>Spot size</small></span><input type="range" id="s-radius" min="20" max="90" step="1"><output id="s-radius-out"></output></label>
    <label class="row"><span>נקודה עמומה במקום הזכייה<small>Faint dot at the win spot</small></span><input class="sw" type="checkbox" id="s-hint"></label>
    <label class="row"><span>הצג נקודות במשחק (לבדיקה)<small>Show spots while playing (testing)</small></span><input class="sw" type="checkbox" id="s-show"></label>
    <label class="row"><span>צלילים<small>Sound</small></span><input class="sw" type="checkbox" id="s-sound"></label>
    <div class="row"><span>אצבעות כדי להתחיל<small>Fingers needed to start</small></span>
      <div class="seg"><button id="s-min1" type="button">1</button><button id="s-min2" type="button">2</button></div>
    </div>
    <div class="row btns"><button id="s-reset" type="button">ברירת מחדל</button><button id="s-close" type="button" class="primary">סגור</button></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
